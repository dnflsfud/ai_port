label: s25_4_combined_recert
display_name: S25.4 combined re-certification (4 flips)
portfolio_role: diagnostic
description: >
  Fixed-250 causal production portfolio. Uses date-grouped LightGBM rank_xendcg,
  purged/embargoed validation, and a one-trading-day execution signal lag.
  The legacy label/output path is retained for automation compatibility; the
  universe is the validated 250-name Universe_Meta set (decision log §S14.2).
  The adopted four-feature forward-sales-slope block is enabled per S13.25;
  benchmark, overlays, optimizer and transaction-cost assumptions remain pinned
  to the canonical iter15_65tkr_reb21_vtg portfolio design.
out_dir: outputs/s25_4_combined_recert
tuning_mode: production
overrides:
  # Causal ranking model. These are the only intentional signal-path changes.
  model_objective: cross_sectional_rank
  causal_validation_enabled: true
  execution_signal_lag_days: 1
  rank_relevance_levels: 10
  # S13.47 (2026-08-20): rank_eval_at [5, 10] -> [20], adopted by user
  # override — decision log S13.47 Production flip (E1 bar missed at
  # dIR +0.2028 but DSR p=0.0543 beats the S13.41/S13.31 promotion
  # precedents; degeneracy improved 13/33 -> 10/33). Early stopping is
  # argmax@20. Rollback = restore "rank_eval_at: [5, 10]" on this line
  # (bit-deterministic pipeline reproduces the old baseline exactly).
  rank_eval_at: [20]

  # Model/data pins copied from the production S0 variant.
  train_window: 1260
  retrain_freq: 63
  val_window: 126
  prediction_ema_alpha: 0.5
  early_stopping_rounds: 100
  lgbm_params:
    objective: rank_xendcg
    metric: ndcg
    learning_rate: 0.02
    num_leaves: 31
    max_depth: 5
    min_child_samples: 60
    # S22 C-05 (decision log S24): INERT — LightGBM bagging needs
    # subsample_freq (bagging_freq) > 0 and the sklearn default is 0. Kept so
    # the certified params block is unchanged; enabling bagging changes every
    # model and needs its own default-OFF arm.
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.3
    reg_lambda: 2.0
    n_estimators: 800
    verbose: -1
    random_state: 42
  ewma_enabled: true
  ewma_alpha: 0.3
  ewma_min_retrains: 2
  ewma_drop_pct: 0.05
  ewma_min_features: 60
  feature_mode: core
  min_model_trees: 10
  max_degenerate_model_rate: 0.25
  fail_on_degenerate_model_rate: false
  max_tail_ffill_days: 10
  fail_on_stale_tail_ffill: false

  # Benchmark / optimizer / execution pins.
  benchmark_type: cap_weighted
  risk_aversion: 1.0
  turnover_penalty: 0.03
  # Production mandate: ex-ante active risk must stay within 3.5% annual TE.
  # The same value is enforced in both the MVO target and post-execution
  # projection, so partial rebalancing cannot bypass the hard constraint.
  max_te_annual: 0.035
  max_single_turnover: 0.15
  sector_deviation: 0.10
  cov_lookback: 126
  bm_weight_floor: 0.02
  max_active_share: 0.45
  max_active_share_ceiling: null
  max_weight: 0.15
  max_active_per_stock: 0.04
  use_score_based: false
  portfolio_style: core_satellite
  satellite_budget: 0.225
  satellite_max_per_stock: 0.04
  enforce_score_gated_ow: true
  score_threshold_for_ow: 0.0
  no_trade_band: 0.003
  # S18.3 (2026-09-10): 0.50 -> 0.42 together with static_execution_enabled
  # (below). 0.42 = the realised median of the dynamic eta under the old
  # confidence path, so the average trading speed is held at the previous
  # level (turnover 1.124x within the preregistered neutral band [0.85, 1.15]).
  # Rollback = restore 0.50 AND delete static_execution_enabled (both lines
  # together; certified by tests/test_s18_fixes.py).
  partial_rebalance_eta: 0.42
  trailing_ic_window: 6
  one_way_tc: 0.0010
  rebalance_freq: 21

  # Mega-cap / proportional-cap controls.
  mega_cap_protection_enabled: true
  mega_cap_bm_threshold: 0.04
  mega_cap_wide_uw_cap: 0.10
  mega_cap_funding_mode: true
  mega_cap_funding_k: 4
  mega_cap_funding_score_max: 0.0
  bm_proportional_cap_enabled: false
  bm_proportional_cap_bm_scale_at_top: 1.5
  bm_proportional_cap_vol_scale_floor: 0.5
  bm_proportional_cap_vol_lookback: 63

  # Post-prediction overlays.
  pead_boost_enabled: true
  pead_boost_weight: 0.30
  pead_decay_days: 7.0
  pead_max_days: 21
  growth_tilt_enabled: true
  growth_tilt_weight: 0.25
  growth_tilt_rev_weight: 0.50
  growth_tilt_fundamental_weight: 0.50
  growth_tilt_eps_skew: 0.50
  growth_tilt_rev_eps_share: 0.50
  growth_tilt_rev_sales_share: 0.50
  growth_tilt_rev_tg_share: 0.00
  signal_stability_lambda: 0.0
  value_trap_gate_enabled: true
  vtg_pe_z_threshold: -0.5
  vtg_momentum_threshold: -0.5
  vtg_accel_threshold: 0.5
  vtg_scale: 0.0

  # Operating guardrails / solver protocol.
  allow_scs_on_ecos_exception: false
  max_name_active_risk_share: 0.35
  max_sector_active_risk_share: 0.85  # recalibrated 2026-07-18, decision log S10.1
  expected_universe_size: 250  # point-in-time membership guard, decision log S14.2
  dr_alpha_enabled: false

  # Fwd sales term-structure slope feature block (4 features), adopted by user
  # override 2026-08-04 — decision log S13.25 Production flips.
  # S23.2 (2026-09-29): ROLLED BACK on correctness grounds (structural audit r6
  # M-01: the Fwd_Sales_Slope_1FY2FY source is a pull-time fixed-fiscal-year
  # history rewritten on every fiscal-year report). Pre-registered S23.1 arm
  # outputs/s23_m01_no_slope vs s23_s0recert (workbook 2026-09-18 14:13:24 /
  # Index 2026-09-28 11:23:35): mechanism PASS (exactly the 4 slope features
  # removed), E2 PASS (TE 3.71%, turnover 1.03x, AS -0.2pp, fallback 0),
  # IR 1.6931 -> 1.8138 (dIR +0.121, splits +0.146/+0.148/+0.039, no-harm
  # PASS). New S0' = S23.2 combined re-certification. Rollback = set true
  # (re-adopt only after the source is re-pulled as rolling FY1/FY2).
  fwd_sales_slope_features_enabled: false

  # Vol-tercile quality tilt (score' = score + 0.25*sd*z_q inside the top
  # idio-vol tercile), adopted by user decision 2026-08-05 — decision log
  # S13.32 Production flip. Zero-cost quality exposure (-0.03 -> +0.05, vol
  # character preserved); IR 1.6196 certified by the S13.32 arm at exact
  # floating-point reproduction. Rollback = delete these two lines
  # (default-OFF, OFF path returns the input object — structural parity).
  vol_quality_tilt_enabled: true
  vol_quality_tilt_lambda: 0.25

  # S13.41 (2026-08-13): option-IV vol-forecast covariance diagonal.
  # User-approved promotion; decision log S13.41 Production flip.
  option_vol_covariance_enabled: true

  # S15 (2026-08-27): structural-review correctness fix pack (8 verified
  # defects behind one flag), adopted by user on correctness grounds —
  # decision log S15 Production flip. Certified same-vintage measurement:
  # IR 1.3811 -> 1.5466 (avg_ic unchanged - structural channel), TE 3.73%,
  # ECOS 194/194. This makes IR 1.5466 the S0' baseline; pre-flip numbers
  # (1.3811) are retired for arm comparisons. Rollback = delete this line
  # (default-OFF, byte-identical restore certified by unit tests).
  s15_fixpack_enabled: true

  # S15.2 (2026-08-28): S13.41 option-scale correctness fix, adopted by
  # user on correctness grounds — decision log S15.2 Production flip.
  # Restores the preregistered S13.41 contract: (a) scale model trained on
  # raw risk returns, (b) loader-imputed iv30_z cells (3.77%) forced inert.
  # Certified same-vintage paired measurement: IR 1.5466 -> 1.5356
  # (avg_ic bit-identical, degenerate 14/33 identical, ECOS 194/194).
  # This makes IR 1.5356 the S0' baseline; 1.5466 is retired for arm
  # comparisons. Rollback = delete this line (default-OFF, byte-identical
  # restore certified by unit tests).
  option_vol_scale_fix_enabled: true

  # S16.1 (2026-08-31): Tier-0 unit/accuracy fix pack (4 verified defects
  # behind one flag: LN GBp/GBP price-unit mismatch pinning tg_upside at a
  # -3.8 sigma constant for 8 names; FCF/CAPEX level_z killed by local-
  # currency scale (ex-KR/JP std 0.0008); cash_conversion_z contaminated by
  # shares outstanding; macro-cross double z-score erasing macro amplitude),
  # adopted by user on correctness grounds — decision log S16.1 Production
  # flip. Certified same-vintage measurement (outputs/s16_1_unit_fixpack):
  # IR 1.5356 -> 1.6953, TE 3.70%, turnover 0.97x, ECOS 194 / fallback 0,
  # degenerate 14/33 -> 12/33, E1 accuracy checks 4/4 confirmed. This makes
  # IR 1.6953 the S0' baseline; 1.5356 is retired for arm comparisons.
  # Rollback = delete this line (default-OFF, byte-identical restore
  # certified by unit tests).
  s16_unit_fixpack_enabled: true

  # S16.2 (2026-08-31): 21-BD cap on the S15 fix-pack #5 persistent revision
  # extension (uncapped, it froze 16.3% of the revision panel; a genuine
  # post-earnings consensus collapse was restored to its pre-collapse value
  # indefinitely — the opposite of the PEAD overlay's intent), adopted by
  # user on correctness grounds — decision log S16.2 Production flip.
  # 21 = pead_max_days (preregistered, no sweep). Certified same-vintage
  # measurement (outputs/s16_2_revision_extension_cap): cap fired on 2,326
  # events releasing 60-69% of frozen cells, avg_ic +13.4%, IR 1.6953 ->
  # 1.7149, TE 3.73%, turnover 1.044x, ECOS 194 / fallback 0. This makes
  # IR 1.7149 the S0' baseline; 1.6953 is retired for arm comparisons.
  # Rollback = delete this line (default-None, byte-identical restore
  # certified by unit tests).
  revision_extension_max_days: 21

  # S16.7 (2026-09-01): enforce the 0.35 per-name Euler active-risk share
  # guardrail inside the optimiser (sequential convex re-solves at BOTH the
  # MVO target and the post-execution projection), adopted by user on
  # risk-discipline grounds — decision log S16.7 Production flip. Certified
  # same-vintage measurement (outputs/s16_7_name_risk_cap): guardrail
  # breaches 31/97 -> 0/97 rebalances, live-book STX risk share 0.543 ->
  # 0.344, avg_ic bit-identical (optimizer-only change), TE 3.71%, turnover
  # 0.977x, ECOS 194 / fallback 0, IR 1.7149 -> 1.7596 (dIR +0.0446 noise
  # band, all 3 splits positive — IR is the no-harm check, not the adoption
  # basis). This makes IR 1.7596 the S0' baseline; 1.7149 is retired for arm
  # comparisons. Rollback = delete this line (default-OFF, byte-identical
  # restore certified by unit tests).
  name_risk_share_cap_enabled: true

  # S17.1-A (2026-09-03): T-01 FactSet coverage-gap fix. The loader's
  # cross-sectional median filled every pre-coverage cell of the price-level
  # sheets (Factset_TG_Price, Factset_Fwd_OpCashflow) with OTHER names'
  # target-price levels, pinning tg_upside at the +5.0 z clip for VRT (409
  # rows) / VST (127) and 14 more late-coverage names (693 cells) and
  # compressing the other 249 names' z by 2.4x on those dates. ON masks the
  # cells before each ticker's first observation back to NaN (interior gaps
  # keep ffill); the panel builder's per-date median then imputes them.
  # Adopted by user on correctness grounds — decision log S17.1 Production
  # flip. Certified same-vintage measurement (outputs/s17_1_coverage_gap_fix,
  # workbook 2026-09-01 14:05:40 / Index 2026-09-02 11:09:18): mechanism VRT
  # +5 cells 409 -> 0, avg_ic 0.016306 -> 0.019641 (+20%, all 3 splits up),
  # TE 3.64% (unchanged), turnover 0.996x, active share +0.19pp, ECOS 194 /
  # fallback 0, degenerate 12/33 -> 13/33, IR 1.7052 -> 1.7330 (dIR +0.028
  # noise band, observation only — accuracy is the adoption basis). This
  # makes IR 1.7330 the S0' baseline; 1.7052 (and 1.7596 on the 08-25
  # vintage) are retired for arm comparisons. Rollback = delete this line
  # (default-OFF, byte-identical restore certified by unit tests).
  s17_coverage_gap_fix_enabled: true

  # S17.3 (2026-09-04): G1-01b / M1 nominal price denominator. The workbook
  # PX_LAST and the PE/PB/PEG ratio sheets are Bloomberg DPDF dividend-
  # reinvestment adjusted (MO 2014-06-30 19.56 vs nominal 41.94), so
  # tg_upside, fwd_opcf_yield and the share count behind cash_conversion_z
  # carried the dividends paid AFTER each date -- a look-ahead that erased
  # the learner's tg_upside signal (live models gain 0.0%) and flipped the
  # high-dividend ranking between the training era and live. ON reads the
  # split-adjusted / dividend-unadjusted PX_LAST_UNADJ sheet (price_v4.py
  # adjustmentNormal/Abnormal=False) as the nominal denominator and rescales
  # the three ratio sheets by PX_UNADJ / PX_LAST; PX_LAST, Daily_Returns,
  # momentum, covariance and P&L paths are untouched. Adopted by user on
  # correctness grounds -- decision log S17.3 Production flip. Data gates
  # 4/4 (no-dividend 5 byte-identical, MO 41.94, high-div TG/PX 2.10 -> 1.08,
  # z gap 2.26 -> 0.24). Certified same-vintage measurement
  # (outputs/s17_5_nominal_price, workbook 2026-09-03 15:51:22 / Index
  # 2026-09-03 14:26:46): TE 3.64%, turnover 1.012x, AS 19.42%, degenerate
  # 10/33 identical, ECOS 194 / fallback 0, live-model tg_upside gain
  # 0.0% -> 1.27%, IR 1.7118 -> 1.7633 (dIR +0.052 noise band, splits
  # -0.14/+0.05/+0.21, observation only -- accuracy is the adoption basis),
  # avg_ic -8% (split-mixed). This makes IR 1.7633 the S0' baseline; 1.7118
  # is retired for arm comparisons. Rollback = delete this line (default-
  # None, byte-identical restore certified by unit tests).
  nominal_price_source: PX_LAST_UNADJ

  # S18.2 (2026-09-08): vol-quality tilt negative-equity mask (decision log
  # S18 P2 / S18.1 arm 1). apply_vol_quality_tilt penalised 21 negative-
  # book-equity, profitable names (ABBV, ORCL, LOW, CL, MO, PM, HCA, MSCI,
  # FICO, ADSK, DELL, ...) because a negative BEST_ROE reads as "junk"
  # inside the top vol tercile (157 penalised pairs / 78 rebalances, -0.80
  # sd). ON sets the quality input to NaN where BEST_ROE < 0 and
  # BEST_EPS > 0 so those cells stay byte-unchanged; every other cell is
  # untouched. Adopted by user on correctness grounds -- decision log S18.2
  # Production flip. Certified same-vintage measurement
  # (outputs/s18_1_tilt_negative_equity, workbook 2026-09-04 14:50:52 /
  # Index 2026-09-07 11:04:19): mechanism PASS (12,370 changed cells on the
  # 21 names, mean +0.27 sd), E2 PASS (TE 3.67%, turnover 1.012x, AS
  # +0.17pp, ECOS 194 / fallback 0, degenerate 11/33 identical), IR 1.6106
  # -> 1.6373 (dIR +0.027 noise band, observation only), avg_ic +6.6%. This
  # makes IR 1.6373 the S0' baseline; 1.6106 is retired for arm comparisons.
  # Rollback = delete this line (default-OFF, byte-identical restore
  # certified by tests/test_s18_fixes.py).
  vol_quality_tilt_negative_equity_mask: true

  # S18.2 (2026-09-08): FactSet target-price basis events (decision log S18
  # P1 / S18.1 arm 2). FactSet restates the target-price history on the
  # post-event basis for Abnormal-type spin-offs (RTX 2020-04 Carrier/Otis,
  # T 2022-04 WarnerMedia) while PX_LAST_UNADJ (S17.3 nominal denominator)
  # does not, and the reverse for Split-type events (DELL 2021-11 VMware,
  # DHR 2016-07 Fortive) -- tg_upside sat at z -3.2..-4.0 for RTX 2014-19,
  # -1.9..-2.6 for T 2014-21, +5.0 for DELL 2019-21 and +3.5 for DHR 2014-15.
  # ON rescales the pre-event target-price rows of the four data-verified
  # names by the inverse vendor step (outputs/s18_prechecks/
  # tg_basis_candidates.csv; GM/KLAC/ADP/HPE etc. rejected, see S18.1);
  # every other cell is byte-unchanged. Adopted by user on correctness
  # grounds -- decision log S18.2 Production flip. Certified same-vintage
  # measurement (outputs/s18_2_tg_basis_events, workbook 2026-09-04 14:50:52
  # / Index 2026-09-07 11:04:19): mechanism PASS (RTX 2014-19 z -3.95 ->
  # +0.14, T -2.43 -> -0.35, DELL +5.0 -> +0.25, DHR +3.49 -> +0.15, cross-
  # sectional z sd 0.925 -> 0.940), E2 PASS (TE 3.61%, turnover 1.050x, AS
  # +0.03pp, ECOS 194 / fallback 0, degenerate 11 -> 12/33 noise), IR 1.6106
  # -> 1.7068 (dIR +0.096 noise band, observation only), avg_ic +3.1%. The
  # S0' baseline is re-certified with BOTH S18.2 flips on the same vintage
  # (outputs/s18_4_flip2_recert, decision log S18.2 result); 1.6373 (arm 1
  # alone) is then retired. Rollback = delete these five lines (default-{},
  # byte-identical restore certified by tests/test_s18_fixes.py).
  # S24.3 (2026-09-30): RTX and T REMOVED on correctness grounds (user
  # decision (a), decision log S23.5/S23.6/S24.3). From the 2026-09-29
  # Bloomberg pull PX_LAST_UNADJ is itself spin-adjusted for the Abnormal
  # class (RTX/T/TT/MRK), so the S18.2 inverse factors double-corrected:
  # tg_upside z pre-event sat at +5.00 (RTX, clip) / +2.62 (T). Certified
  # same-vintage arm outputs/s24_3_tg_events_a vs outputs/s24_g0_new
  # (workbook 2026-09-30 14:27:35 / Index 11:31:05): mechanism PASS (RTX
  # +5.00 -> +0.16, T +2.62 -> -0.33, DELL/DHR drift <= 0.03, post-2022-07
  # TG features and all 59 other features bit-identical), E2 PASS (TE 3.79%,
  # turnover 1.0045x, AS -0.13pp, ECOS 184 / fallback 0), IR 1.6952 ->
  # 1.8328 (dIR +0.138, splits +0.165/+0.083/+0.135, no-harm PASS; formal
  # E1 reported only). New S0' on this vintage = 1.8328. DELL/DHR stay
  # (Split class, raw TG/UNADJ step still present). Rollback = re-add
  #   RTX: {"2020-04-03": 1.696} / T: {"2022-04-11": 1.324}.
  tg_basis_events:
    DELL: {"2021-11-02": 0.506}
    DHR: {"2016-07-05": 0.758}

  # S18.3 (2026-09-10): static execution -- rebalance confidence fixed at 1.0
  # (compute_signal_confidence not called; decision log S18 P3: the IC-driven
  # confidence had no persistence and 34% of rebalances sat at the eta floor
  # 0.22, i.e. random slow-downs). S18.1 arm 3 (eta 0.50) traded 1.28x and
  # failed E2; this S18.3 re-attempt pairs the flag with partial_rebalance_eta
  # 0.42 (single preregistered value, no sweep). Adopted by user under the
  # preregistered execution frame (G0 + mechanism + E2 + no-harm; formal E1
  # not required) -- decision log S18.3 Production flip. Certified same-
  # vintage measurement (outputs/s18_5_static_execution_eta042, workbook
  # 2026-09-04 14:50:52 / Index 2026-09-10 11:20:39, base s18_4_flip2_recert):
  # G0 PASS (avg_ic bit-identical 0.018299, degenerate 12/33 identical),
  # mechanism PASS (turnover 0.7085 -> 0.7962 = 1.124x), E2 PASS (TE 3.62% ->
  # 3.73%, AS 19.78% -> 20.49%, ECOS 194 / fallback 0), IR 1.6513 -> 1.7197
  # (dIR +0.068, splits +0.166/-0.098/+0.127 -- noise band, observation only),
  # MaxDD -32.35% -> -32.84%. This run's config equals production after the
  # flip, so IR 1.7197 is the new S0' baseline; 1.6513 is retired.
  # Rollback = delete this line AND restore partial_rebalance_eta 0.50
  # (default-OFF, byte-identical restore certified by tests/test_s18_fixes.py).
  static_execution_enabled: true

  # S18.7 (2026-09-11): trading-day calendar (data audit 2026-09-09 Medium-2,
  # decision log S18.6/S18.7). The workbook sheets sit on a daily calendar
  # (price_v4 reindex + ffill) and align_dates dropped weekends only, so
  # ~120 US-holiday weekdays survived in the model calendar: US names 100%
  # stale (zero return) while non-US names moved -- asymmetric rows in
  # training, targets and the 21-row rebalance / retrain grids. ON restricts
  # every dated raw sheet to the BusinessDays sheet and recomputes
  # Daily_Returns from the kept PX_LAST rows (non-US moves across a dropped
  # day compound into the next kept row). Adopted by user on correctness
  # grounds -- decision log S18.7 Production flip. Certified same-vintage
  # measurement (outputs/s18_6_business_day_calendar, workbook 2026-09-11
  # 13:34:45 / Index 2026-09-11 11:00:19, base s18_7_s0recert): mechanism
  # PASS (holiday weekday rows 119 -> 0, calendar 3295 -> 3176, Daily_Returns
  # recomputed), E2 PASS (TE 3.79%, turnover 0.991x, AS +0.03pp, ECOS 184 /
  # fallback 0), IR 1.7167 -> 1.7512 (dIR +0.035, splits +0.148/-0.187/+0.176
  # -- observation only; avg_ic 0.0177 -> 0.0126 is the retrain grid shifting
  # on the shorter calendar, within 1 SE). This run's config equals
  # production after the flip, so IR 1.7512 is the new S0' baseline; 1.7167
  # is retired. Live effect: rebalance / retrain grids now count trading
  # days. Rollback = delete this line (default-OFF, byte-identical restore
  # certified by tests/test_data_loader.py + tests/test_s18_fixes.py).
  business_day_calendar_enabled: true

  # S23.2 (2026-09-29): uncentered PCA residual label (structural audit r6 B-01:
  # sklearn transform/inverse_transform centred the 20-day forward return on the
  # DAILY window mean, so the label carried a spurious anti-momentum term
  # -(I-P) mu_daily). Adopted on correctness grounds, pre-registered S23.1 arm
  # outputs/s23_b01_label_uncentered vs s23_s0recert (workbook 2026-09-18
  # 14:13:24 / Index 2026-09-28 11:23:35): mechanism PASS (100% of labels
  # changed, median Spearman(legacy - fixed, momentum_252d) -0.81), E2 PASS
  # (TE 3.78%, turnover 0.96x, AS +0.2pp, fallback 0), IR 1.6931 -> 1.7103
  # (dIR +0.017, splits +0.030/+0.147/-0.125, no-harm PASS; degenerate
  # retrains 12/31 -> 9/31). New S0' = S23.2 combined re-certification.
  # Rollback = delete this line (default-OFF, byte-identical restore certified
  # by tests/test_target_engine.py).
  pca_target_uncentered_enabled: true

  # S23.3 (2026-09-29): lag the S13.41 option-vol covariance scale one row
  # (structural audit r6 D-04: scale row t used close-t iv30_z / returns while
  # the covariance window and the alpha are <= t-1). Adopted by USER DECISION on
  # correctness grounds, overriding the pre-registered do-no-harm rule it missed
  # (S23.1 arm outputs/s23_d04_optvol_lag vs s23_s0recert: mechanism PASS -- alpha
  # bit-identical, weights move <= 1.0pp; E2 PASS -- TE 3.80%, turnover 1.005x,
  # AS -0.05pp, fallback 0; IR 1.6931 -> 1.6751, dIR -0.018 with all three splits
  # negative -0.019/-0.010/-0.022). Decision log S23.3. Rollback = delete this
  # line (default-OFF, byte-identical restore certified by tests/test_option_vol_cov.py).
  option_vol_scale_lag_enabled: true

  # S25.4 (2026-10-08): B-02 — the down-only "gradual pre-earnings drop" mask in
  # clean_revision_spikes froze genuine consensus downgrade ramps (upgrades already
  # passed); it touched 495k eps_rev cells and, through the 63d MAs, almost the
  # whole revision panel. Adopted by user decision on correctness grounds —
